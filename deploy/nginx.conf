# nginx config for Medical CAT Translator
# Placed at /etc/nginx/sites-available/medcat
# certbot --nginx will add SSL block automatically

# Частота на публичных дверях (вход, регистрация, коды, анкеты): потолки
# в самом приложении есть, но они в памяти процесса и по IP; здесь — второй
# рубеж, который не зависит от кода. 20 запросов в минуту с адреса, пачка 10.
limit_req_zone $binary_remote_addr zone=medcat_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    # Allow large DOCX uploads (up to 50 MB)
    client_max_body_size 50M;

    # Long timeouts for batch translation (up to 30 min)
    proxy_read_timeout    1800s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    1800s;

    location ~ ^/api/(auth/(login|register|verify|resend|forgot|reset)|public/) {
        limit_req zone=medcat_auth burst=10 nodelay;
        limit_req_status 429;   # не HTML 503 от nginx: api.js читает JSON и код
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Сжатие статики. Три строки, без которых сжатия НЕТ вовсе:
    #   * gzip_proxied — по умолчанию off, а у нас ПРОКСИРУЕТСЯ ВСЁ, включая
    #     статику (её отдаёт сам сервис), то есть без неё не сжимается ничего;
    #   * text/javascript — именно такой тип ставит python для .js и .jsx
    #     (см. mimetypes.add_type в main.py). Список из одного application/javascript
    #     оставлял весь код фронтенда несжатым;
    #   * gzip_vary — иначе общий кэш отдаст сжатый ответ тому, кто его не просил.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml text/plain;
    gzip_min_length 1024;

    # HTTP/2. По старому протоколу браузер держит шесть соединений на хост,
    # и остальные файлы ждут в очереди; по HTTP/2 они едут по одному
    # соединению разом. Директива действует на прослушивателе 443, который
    # дописывает certbot. На nginx старше 1.25 строки здесь нет, а слово http2
    # пишется в самой listen: `listen 443 ssl http2;`.
    http2 on;
}
