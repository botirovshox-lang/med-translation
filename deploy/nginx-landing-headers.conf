# Заголовки страниц ЛЕНДИНГА на simpletranslate.me (с 21.10.2026).
# Ставится в /etc/nginx/snippets/simpletranslate-landing.conf и включается
# в каждый location лендинга в nginx.conf (`include snippets/…`): add_header
# внутри location отменяет все add_header уровня server.
# Те же заголовки, что у приложения (инвариант 25), кроме CSP: инлайн-скрипт
# и стили лежат в самой странице, nonce на статику nginx поставить не может,
# поэтому 'unsafe-inline'; Метрика и шрифты — их хосты. Фрейм передачи файла
# (/handoff) теперь на том же адресе — 'self'.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.uz; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.uz; frame-src 'self' https://mc.yandex.ru https://mc.yandex.com blob:; frame-ancestors 'self' https://webvisor.com https://*.webvisor.com; base-uri 'self'; form-action 'self'" always;
