# Лендинг SimpleTranslate — статика на поддомене click.simpletranslate.me.
# Ставится в /etc/nginx/sites-enabled/click (ОТДЕЛЬНЫМ файлом, как medcat —
# см. CLAUDE.md, «Про nginx знать две вещи»). SSL дописывает certbot:
#   certbot --nginx -d click.simpletranslate.me
# — только ПОСЛЕ того, как A-запись click → 31.129.100.106 появилась в DNS.
#
# Приложение здесь не участвует: страница статическая, без API и без входа,
# поэтому proxy_pass нет, а всё, что отдаётся, лежит в /opt/med-translation/landing.

server {
    listen 80;
    listen [::]:80;
    server_name click.simpletranslate.me;

    root /opt/med-translation/landing;
    index index.html;
    charset utf-8;

    # .md — текст, а не application/octet-stream: pricing.md читают агенты.
    types { text/markdown md; }
    include /etc/nginx/mime.types;

    # Кэш — через expires, а НЕ через add_header в location: add_header
    # внутри location отменяет ВСЕ add_header уровня server, то есть
    # заголовки безопасности ниже перестали бы доходить до страницы.
    # Страница без кэша (правится выкатом), картинки и иконка — на неделю.
    location = / { try_files /index.html =404; expires -1; }
    location ~* \.(png|svg|ico|webp|jpg)$ { expires 7d; }
    location / { try_files $uri $uri/ =404; }

    # Заголовки безопасности — те же, что у приложения (инвариант 25),
    # кроме CSP: инлайн-скрипт и стили лежат в самой странице, а nginx
    # nonce на статику поставить не может, поэтому 'unsafe-inline'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml text/plain application/xml text/xml;
    gzip_min_length 1024;
}
