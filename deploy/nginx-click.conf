# click.simpletranslate.me — прежний адрес лендинга. С 21.10.2026 лендинг —
# корень simpletranslate.me (deploy/nginx.conf), а здесь — постоянный
# переход с тем же путём и параметрами: старые ссылки, реклама и позиции
# в поиске переезжают на новый адрес. Живой файл — /etc/nginx/sites-enabled/click
# (блоки SSL дописал certbot; правится на месте, а не копируется).

server {
    server_name click.simpletranslate.me;
    location / { return 301 https://simpletranslate.me$request_uri; }
    # listen 443 ssl + сертификаты — блоки certbot в живом файле.
}
