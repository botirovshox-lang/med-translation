# nginx config for Medical CAT Translator
# Placed at /etc/nginx/sites-available/medcat
# certbot --nginx will add SSL block automatically

# Частота на публичных дверях (вход, регистрация, коды, анкеты): потолки
# в самом приложении есть, но они в памяти процесса и по IP; здесь — второй
# рубеж, который не зависит от кода. 20 запросов в минуту с адреса, пачка 10.
limit_req_zone $binary_remote_addr zone=medcat_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=medcat_beacon:5m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    # Allow large DOCX uploads (up to 50 MB)
    client_max_body_size 50M;

    # Long timeouts for batch translation (up to 30 min)
    proxy_read_timeout    1800s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    1800s;

    # С 21.10.2026 на этом же адресе два сайта: ЛЕНДИНГ (статика из landing/,
    # корень, /uz/, /en/, картинки) и ПРИЛОЖЕНИЕ (всё остальное — uvicorn:
    # /app, /login, /register, /api/…). Поэтому «закрыто от индексации»
    # стоит НЕ на уровне server, а только у приложения (location / ниже):
    # лендинг поисковику нужен. Заголовки безопасности и CSP лендинга —
    # одним файлом (nginx-landing-headers.conf → /etc/nginx/snippets/),
    # потому что add_header внутри location отменяет все add_header сверху,
    # и без include каждое место лендинга осталось бы без них.
    root /opt/med-translation/landing;
    charset utf-8;

    # www — не второй сайт, а опечатка адреса: одна копия приложения на двух
    # хостах для поисковика — дубль. Перенаправляем на основной. (В живом
    # конфиге это стоит в server-блоке 443, который дописал certbot.)
    if ($host = www.simpletranslate.me) {
        return 301 https://simpletranslate.me$request_uri;
    }

    # ─── Лендинг (статика, tools/landing_build.py) ─────────────────────
    # robots.txt, sitemap.xml и llms.txt собирает сборщик лендинга: там же
    # закрыты от обхода двери приложения (/api/, /app, /login, /register…).
    location = / { try_files /index.html =404; expires -1; include snippets/simpletranslate-landing.conf; }
    # Регулярка В КАВЫЧКАХ: без них nginx читает `{2}` как начало блока.
    location ~ "^/(uz|en)/$" { try_files $uri/index.html =404; expires -1; include snippets/simpletranslate-landing.conf; }
    # /start/ — прежний адрес главной: постоянный переход с параметрами.
    location ~ ^/start/media/(.*)$ { return 301 /media/$1; }
    location ~ ^/start(/|$) {
        if ($arg_lang = uz) { return 301 /uz/$is_args$args; }
        if ($arg_lang = en) { return 301 /en/$is_args$args; }
        return 301 /$is_args$args;
    }
    location ^~ /media/ {
        try_files $uri =404; expires 7d; include snippets/simpletranslate-landing.conf;
        # .vtt — своим типом: при nosniff дорожку с octet-stream браузер вправе не взять.
        location ~* \.vtt$ { types {} default_type "text/vtt; charset=utf-8"; }
    }
    location ^~ /img/ { try_files $uri =404; expires 7d; include snippets/simpletranslate-landing.conf; }
    location = /pricing.md { types {} default_type "text/markdown; charset=utf-8"; expires -1; include snippets/simpletranslate-landing.conf; }
    location ~ "^/(robots\.txt|sitemap\.xml|llms\.txt|og\.png|logo\.png|track\.js|favicon\.ico|favicon\.svg|favicon-96\.png|apple-touch-icon\.png|[0-9a-f]{32}\.txt)$" {
        try_files $uri =404; expires 1d; include snippets/simpletranslate-landing.conf;
    }

    # ─── Приложение (uvicorn) ───────────────────────────────────────────
    location ~ ^/api/(auth/(login|register|verify|resend|forgot|reset)|public/) {
        limit_req zone=medcat_auth burst=10 nodelay;
        limit_req_status 429;   # не HTML 503 от nginx: api.js читает JSON и код
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ошибки браузера (инвариант 34, п. 17): дверь публичная, тело маленькое.
    # Потолок тела здесь — первый рубеж (до приложения тело не доходит),
    # частоту держит своя зона: зона входа была бы общей с регистрацией,
    # и белый экран у толпы запирал бы вход.
    location = /api/client/beacon {
        client_max_body_size 64k;
        limit_req zone=medcat_beacon burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Готовые видео (субтитры дорожкой, озвучка) — гигабайты. Приложение
    # проверяет подписанную ссылку и отвечает X-Accel-Redirect на этот адрес,
    # а файл отдаёт nginx: через цикл событий единственного воркера 2 ГБ
    # не идут (инвариант 38). `internal` — снаружи адрес не открывается.
    # Включается переменной MEDIA_ACCEL_PREFIX=/_media/ в /etc/medcat/env.
    location /_media/ {
        internal;
        alias /opt/med-translation/backend/data/media/;
    }

    # Куски загрузки видео (8 МБ) пишутся приложением сразу на диск;
    # буферизация nginx здесь — вторая запись того же на тот же диск.
    location ~ ^/api/media/upload/[A-Za-z0-9_-]+/chunk$ {
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Приложение — за логином, в поиске ему делать нечего: noindex на КАЖДОМ
    # его ответе. Свой add_header здесь — единственный в этом location.
    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Сжатие статики.
    #   * text/javascript обязателен: именно такой тип ставит python для .js
    #     и .jsx (mimetypes.add_type в main.py). Список из одного
    #     application/javascript оставлял ВЕСЬ код фронтенда несжатым;
    #   * gzip_vary — иначе общий кэш отдаст сжатый ответ тому, кто его
    #     не просил.
    #   * gzip_proxied сюда НЕ нужен, и это стоит сказать прямо, потому что
    #     читается он ровно наоборот: он про запросы, пришедшие С заголовком
    #     Via (клиент за чужим прокси), а не про наш proxy_pass. Обычный
    #     браузер Via не шлёт, и умолчание `off` сжатию не мешает.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml text/plain application/xml text/xml;
    gzip_min_length 1024;
}

# HTTP/2 — НЕ в этом файле, и вот почему. По HTTP/1.1 браузер держит шесть
# соединений на хост, и остальные файлы ждут очереди; по HTTP/2 они едут
# по одному соединению разом — на экране входа это два десятка файлов.
# Но включается он на прослушивателе 443, а его дописывает certbot УЖЕ ПОСЛЕ
# этого файла. Поэтому правится готовый конфиг в /etc/nginx/sites-enabled/medcat:
#
#     listen [::]:443 ssl http2 ipv6only=on;   # было: без http2
#     listen 443 ssl http2;
#
# Так пишется на nginx до 1.25 (на боевом 1.24). С 1.25 слово из listen убрали
# и завели отдельную директиву `http2 on;` в server — старый nginx её не знает
# и НЕ ПОДНИМЕТСЯ вовсе, а на этом хосте живут и чужие сайты. Проверять
# обязательно: `nginx -t` до `systemctl reload nginx`.
