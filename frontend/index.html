<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>SimpleTranslate</title>
  <!-- Превью ссылки в Telegram и почте. Приложение закрыто от поиска
       (noindex выше и X-Robots-Tag в nginx), а публичное лицо сервиса —
       лендинг click.simpletranslate.me: туда ведёт og:url и картинка. -->
  <meta name="description" content="Перевод документов Word, PDF, Excel и PowerPoint с проверкой каждой строки. Файл возвращается в том же оформлении." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SimpleTranslate" />
  <meta property="og:title" content="SimpleTranslate — перевод документов в том же оформлении" />
  <meta property="og:description" content="Word, PDF, Excel и PowerPoint: обратный перевод, сверка чисел и глоссарий на каждой строке." />
  <meta property="og:url" content="https://click.simpletranslate.me/" />
  <meta property="og:image" content="https://click.simpletranslate.me/og.png" />
  <link rel="stylesheet" href="css/styles.css?v=__V__" />
  <style>
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ════════════════════════════════════════════════════════════════
       Загрузчик. Стоит В КОНЦЕ <body>, а не в <head>: скрипты вставляются
       отсюда и выполняются, как только доедут, — app.jsx на последней
       строке зовёт document.getElementById("root"), и из <head> он нашёл бы
       пустоту. Документ весит три килобайта, так что ждать его разбора
       нечего.

       Что здесь делается и почему — три решения, каждое стоило секунд.

       1) БЕЗ BABEL. Файлы с расширением .jsx самого JSX НЕ СОДЕРЖАТ: везде
          React.createElement (потому их и умеют выполнять тесты в node).
          То есть babel.min.js — три мегабайта — скачивался и разбирал
          миллион знаков кода на КАЖДОЙ загрузке ради одного: перевода
          стрелок и async/await в ES5. Замер на быстром настольном
          процессоре — 5 секунд; на телефоне это десятки. Здесь они
          подключаются обычными скриптами, и браузер выполняет их как есть.
          Порог браузера от этого не изменился: в коде нет ни `?.`, ни `??`,
          самое новое — async/await (2017), а React 18 и так требует больше.
          ВЕРНУТЬ JSX-синтаксис в эти файлы нельзя, не вернув сборку: браузер
          её не поймёт. Сторожит tests/test_no_babel.js.

       2) СЛОВАРЬ — ОДИН И НЕ ЦЕЛИКОМ. Раньше ехали ОБА (i18n_uz.js и
          i18n_en.js, по 280 КБ), то есть каждый получал ещё и словарь языка,
          которого не выбирал. И ехали они ДО первого кадра: надписи верхнего
          уровня зовут TR при выполнении файла. Теперь язык один, а файла
          у языка два: i18n_<код>.js — надписи экрана входа (их выводит из
          исходников tools/i18n_build.py) плюс вся таблица сервера, и
          i18n_<код>.rest.js — остальное, оно едет вместе с вкладками.
          Язык читается из того же localStorage, что и в i18n.js: ключ, язык
          по умолчанию и язык КЛЮЧЕЙ (у русского словаря нет и не будет —
          ключ и есть русская строка) повторены НАМЕРЕННО, потому что
          спросить i18n.js можно только после того, как он загружен, а это
          лишнее ожидание ровно перед самым тяжёлым файлом. И расхождение
          констант, и состав первого файла сторожит tests/test_i18n.js
          (разделы 7 и 7б).

       3) ВКЛАДКИ — ПОСЛЕ ЭКРАНА ВХОДА. Девять файлов вкладок весят больше
          мегабайта и на экране входа не нужны ни одним байтом. Порядок их
          загрузки СОХРАНЁН (async = false): файлы живут в одной глобальной
          области, и tab_preflight.jsx намеренно идёт после
          tab_export_preflight.jsx. Решение «ждать вкладки или рисовать
          сразу» принимает app.jsx — он один знает, есть ли токен сессии.
       ════════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var V = "__V__";                  // подставляет сервер: отпечаток файлов
      var LS_KEY = "mct-lang";          // = i18n.js
      var DEFAULT_LANG = "uz";          // = i18n.js, DEFAULT_LANG
      var KEY_LANG = "ru";              // язык КЛЮЧЕЙ: словаря у него нет

      var lang = "";
      try { lang = window.localStorage.getItem(LS_KEY) || ""; } catch (e) { /* приватное окно */ }
      /* Пришёл с ЛЕНДИНГА (`?lang=ru`): страница, с которой он нажал
         «Перевести», и есть его язык. Иначе русский посетитель увидел бы
         экран регистрации на узбекском — языке по умолчанию. Только когда
         своего выбора в браузере нет: вернувшийся человек свой язык уже
         выбрал, и ссылка его не переписывает. i18n.js прочтёт то же значение. */
      if (!lang) {
        var m = /[?&]lang=([a-z]{2})(?:&|#|$)/.exec(window.location.search || "");
        if (m) { lang = m[1]; try { window.localStorage.setItem(LS_KEY, lang); } catch (e) { /* приватное окно */ } }
      }
      /* Хранилище правит кто угодно, а значение идёт в АДРЕС: всё, что не
         похоже на код языка, заменяем умолчанием, а не грузим по нему файл. */
      if (!/^[a-z]{2}$/.test(lang)) lang = DEFAULT_LANG;

      var core = ["vendor/react.production.min.js", "vendor/react-dom.production.min.js", "js/i18n.js"];
      if (lang !== KEY_LANG) core.push("js/i18n_" + lang + ".js");
      core.push("js/api.js", "js/handoff.js", "js/ui.jsx", "js/app.jsx");

      /* Остальной словарь — ПЕРВЫМ в этом списке и по той же причине,
         по какой здесь вообще важен порядок: надписи верхнего уровня
         во вкладках зовут TR при ВЫПОЛНЕНИИ файла, а не при показе. */
      var TABS = [];
      if (lang !== KEY_LANG) TABS.push("js/i18n_" + lang + ".rest.js");
      TABS = TABS.concat(["js/tab_import.jsx", "js/video_edit.jsx", "js/tab_editor_detail.jsx", "js/tab_editor.jsx",
                  "js/tab_glossary_tm.jsx", "js/tab_export_preflight.jsx", "js/tab_preflight.jsx",
                  "js/tab_org.jsx", "js/tab_profile.jsx", "js/tab_learn.jsx",
                  "js/tab_admin.jsx",
                  /* Знакомство и поддержка. Здесь, а не в core: на экране
                     входа не нужны ни тур (некого знакомить), ни диалог
                     (дверь за входом), а App зовёт слой по имени и терпит
                     его отсутствие. */
                  "js/onboarding.jsx",
                  /* Чтение надписей у себя. Сам файл маленький; исполнитель
                     тензоров и модели (21 МБ) качаются только по нажатию. */
                  "js/ocr_local.js"]);

      /* async = false у вставленного скриптом тега значит «качай параллельно,
         ВЫПОЛНЯЙ по порядку». Порядок тут несущий (см. пункт 3 выше). */
      function load(list) {
        var left = list.length;
        return new Promise(function (done) {
          if (!left) return done();
          list.forEach(function (src) {
            var s = document.createElement("script");
            s.src = src + "?v=" + V;
            s.async = false;
            s.onload = s.onerror = function () { if (--left === 0) done(); };
            document.head.appendChild(s);
          });
        });
      }

      var tabs = null;
      window.BOOT = {
        /* Идемпотентно: зовут и загрузчик, и кнопка входа. */
        tabs: function () { return tabs || (tabs = load(TABS)); },
        /* Отпечаток файлов — наружу. Его спрашивает чтение надписей
           в браузере: модели и исполнителя оно качает САМО, а значит само
           же обязано поставить `?v=`, иначе они застрянут в кэше старыми. */
        v: V,
      };
      load(core);
    })();
  </script>
</body>
</html>
