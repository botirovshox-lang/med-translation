# Лендинг SimpleTranslate — статика на поддомене click.simpletranslate.me.
# Ставится в /etc/nginx/sites-enabled/click (ОТДЕЛЬНЫМ файлом, как medcat —
# см. CLAUDE.md, «Про nginx знать две вещи»).
#
# SSL ВЫДАН 23.09.2026 (A-запись click → 31.129.100.106 уже в DNS):
#   certbot --nginx -d click.simpletranslate.me --redirect
# и certbot дописал В ЖИВОЙ ФАЙЛ блок `listen 443 ssl`, пути к сертификату
# и отдельный server с редиректом с 80-го. ЗДЕСЬ ЭТОГО НЕТ намеренно:
# в репозитории лежит то, что пишет человек, а не то, что дописала машина.
#
# ОТСЮДА ПРАВИЛО ВЫКАТА: СЛЕПО КОПИРОВАТЬ ЭТОТ ФАЙЛ ПОВЕРХ ЖИВОГО НЕЛЬЗЯ —
# так снимается HTTPS со всего поддомена. Правишь конфиг: перенеси СВОЮ
# правку в живой файл (diff покажет её среди строк «# managed by Certbot»),
# затем `nginx -t` и только потом `systemctl reload nginx`. Проверка
# обязательна: `location ~ ^/[a-z]{2}/$` без кавычек уже роняла старт
# целиком (см. ниже).
#
# Приложение здесь не участвует: страница статическая, без API и без входа,
# поэтому proxy_pass нет, а всё, что отдаётся, лежит в /opt/med-translation/landing.

server {
    listen 80;
    listen [::]:80;
    server_name click.simpletranslate.me;

    root /opt/med-translation/landing;
    index index.html;
    charset utf-8;

    # .md — текст, а не application/octet-stream: pricing.md читают агенты.
    # Своим location, а не вторым `types` на уровне server: две таблицы
    # types на одном уровне не складываются, побеждает последняя.
    location ~* \.md$ { types {} default_type "text/markdown; charset=utf-8"; }

    # Кэш — через expires, а НЕ через add_header в location: add_header
    # внутри location отменяет ВСЕ add_header уровня server, то есть
    # заголовки безопасности ниже перестали бы доходить до страницы.
    # Страница без кэша (правится выкатом), картинки и иконка — на неделю.
    # Страницы языков лежат в своих папках (/uz/, /en/), и `try_files $uri/`
    # ниже отдаёт их index.html сам. Но правило «не кэшировать» обязано
    # накрыть их ТОЖЕ: страница правится выкатом, а закэшированная на неделю
    # узбекская версия осталась бы у человека прежней после правки текста.
    location = / { try_files /index.html =404; expires -1; }
    # Регулярка В КАВЫЧКАХ: без них nginx читает `{2}` как начало блока
    # и падает на старте с «unknown directive» — то есть сайт не поднимется
    # вовсе. Ловится это только `nginx -t`, поэтому его зовут ДО reload.
    location ~ "^/[a-z]{2}/$" { try_files $uri/index.html =404; expires -1; }
    location ~* \.(png|svg|ico|webp|jpg)$ { expires 7d; }
    location / { try_files $uri $uri/ =404; }

    # Своя страница «не найдено» (собирает tools/landing_build.py): три языка,
    # ссылки на главные и на форму перевода. Код ответа остаётся 404 —
    # «мягкий 404» с кодом 200 поисковик считает дублем главной.
    # internal: по прямому адресу /404.html её не отдают, иначе это
    # ещё одна индексируемая страница с кодом 200.
    error_page 404 /404.html;
    location = /404.html { internal; expires -1; }

    # Заголовки безопасности — те же, что у приложения (инвариант 25),
    # кроме CSP: инлайн-скрипт и стили лежат в самой странице, а nginx
    # nonce на статику поставить не может, поэтому 'unsafe-inline'.
    # Три двери наружу, и каждая названа поимённо:
    #   * frame-src simpletranslate.me — невидимый фрейм /handoff, которому
    #     форма передаёт файл (frontend/js/handoff.js);
    #   * form-action simpletranslate.me — сама форма «Перевести» (без
    #     скрипта она уходит в приложение обычной отправкой);
    #   * mc.yandex.* — Яндекс Метрика: скрипт, пиксель, отправка событий
    #     и фрейм Вебвизора. Домены .com и .uz — Метрика шлёт данные на
    #     региональный домен посетителя.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.uz; connect-src https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.uz; frame-src https://simpletranslate.me https://mc.yandex.ru https://mc.yandex.com blob:; frame-ancestors 'self' https://webvisor.com https://*.webvisor.com; base-uri 'self'; form-action 'self' https://simpletranslate.me" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml text/plain application/xml text/xml;
    gzip_min_length 1024;
}
